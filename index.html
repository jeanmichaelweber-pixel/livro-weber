<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1f5c2e">
<title>Livro Pecuário Weber</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root { --verde: #1f5c2e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #f1f5ee; font-family: Arial, Helvetica, sans-serif; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 30px; display: flex; align-items: center; justify-content: center; gap: 8px;
         font-size: 13px; font-weight: bold; color: #fff; background: #37474f; z-index: 10; padding: 0 8px; white-space: nowrap; overflow: hidden; }
  #bar.ok { background: #2e7d32; } #bar.pend { background: #ef6c00; } #bar.off { background: #455a64; } #bar.err { background: #c62828; }
  #bar button { border: 0; border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: bold; background: rgba(255,255,255,.9); color: #222; }
  #tela { position: fixed; top: 30px; left: 0; width: 100%; height: calc(100% - 30px); border: 0; background: #f1f5ee; }
  #aviso { padding: 60px 22px; font-size: 17px; line-height: 1.5; color: #1d2a1f; display: none; }
  #aviso h2 { color: var(--verde); }
  #painel { position: fixed; inset: 30px 0 0 0; background: rgba(0,0,0,.45); z-index: 20; display: none; }
  #painel .box { position: absolute; left: 0; right: 0; bottom: 0; max-height: 80%; overflow: auto; background: #fff; border-radius: 16px 16px 0 0; padding: 16px; }
  #painel h3 { margin: 0 0 10px; }
  .it { border-bottom: 1px solid #eee; padding: 10px 0; font-size: 14px; }
  .it .e { color: #c62828; white-space: pre-line; margin: 4px 0; }
  .it button, .fechar { border: 0; border-radius: 8px; padding: 8px 12px; font-weight: bold; margin-right: 6px; }
  .desc { background: #fdecea; color: #c62828; }
  .tela2 { position: fixed; top: 30px; left: 0; right: 0; bottom: 0; overflow: auto; display: none; background: #f1f5ee; color: #1d2a1f; }
  .hd { background: var(--verde); color: #fff; padding: 18px 16px; }
  .hd h1 { margin: 0; font-size: 22px; } .hd p { margin: 4px 0 0; opacity: .85; }
  .hd a { color: #fff; float: right; text-decoration: none; border: 1px solid rgba(255,255,255,.5); border-radius: 8px; padding: 6px 10px; font-size: 14px; }
  .mn { padding: 16px; display: grid; gap: 14px; }
  .mn a, .mn button.bb { display: block; text-decoration: none; color: #1d2a1f; background: #fff; border-radius: 14px; padding: 22px 18px; border: 0; text-align: left; width: 100%;
         box-shadow: 0 1px 3px rgba(0,0,0,.15); font-size: 21px; font-weight: bold; border-left: 8px solid #2e7d32; font-family: inherit; }
  .mn small { display: block; font-weight: normal; font-size: 14px; color: #55625a; margin-top: 6px; }
  .mn .c2 { border-left-color: #c58a12; } .mn .c3 { border-left-color: #00838f; } .mn .c4 { border-left-color: #6d4c41; }
  .cx { padding: 14px; }
  .card { background: #fff; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
  .bl { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid #eee; }
  .bl b { width: 48px; font-size: 19px; }
  .bl button { flex: 1; height: 52px; font-size: 22px; font-weight: bold; border-radius: 10px; border: 2px solid #cfd8d1; background: #fff; }
  .bl button.on0 { background: #fde2e1; border-color: #c62828; } .bl button.on1 { background: #dcf5e3; border-color: #2e7d32; } .bl button.on2 { background: #fff3c4; border-color: #f9a825; }
  .leg { font-size: 14px; color: #55625a; margin-bottom: 8px; }
  .inp { width: 100%; font-size: 17px; padding: 11px; border: 1px solid #b9c4bc; border-radius: 9px; margin-top: 10px; }
  .env { display: block; width: 100%; margin-top: 14px; font-size: 20px; font-weight: bold; padding: 16px; border: 0; border-radius: 12px; background: #2e7d32; color: #fff; }
  .ok2 { background: #e3f1e4; border: 2px solid #2e7d32; border-radius: 12px; padding: 12px; margin-bottom: 12px; white-space: pre-line; }
  textarea.ord { width: 100%; height: 260px; font-size: 13px; border-radius: 9px; border: 1px solid #b9c4bc; padding: 8px; } .fechar { background: var(--verde); color: #fff; width: 100%; margin-top: 12px; font-size: 16px; padding: 12px; }
</style>
</head>
<body>
<div id="bar">Carregando…</div>
<iframe id="tela" title="Livro"></iframe>
<div id="home" class="tela2"></div>
<div id="cocho" class="tela2"></div>
<div id="aviso"></div>
<div id="painel"><div class="box" id="pbox"></div></div>
<script>
(function () {
  'use strict';
  const K = { cfg: 'lw_cfg', dados: 'lw_dados', fila: 'lw_fila', erros: 'lw_erros', img: 'lw_img' };
  const ler = function (k, padrao) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : padrao; } catch (e) { return padrao; } };
  const gravar = function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } };
  const $ = function (id) { return document.getElementById(id); };

  // ── configuração: vem no link que o escritório manda (?api=...&k=...&u=...) ──
  const prm = new URLSearchParams(location.search);
  let cfg = ler(K.cfg, null);
  if (cfg && !cfg.faz) {                                   // versão anterior do app (uma fazenda só)
    cfg = { u: cfg.u, faz: [{ api: cfg.api, k: cfg.k, n: '' }], atual: 0 };
    try { const d0 = localStorage.getItem(K.dados), i0 = localStorage.getItem(K.img); if (d0) localStorage.setItem(K.dados + '_0', d0); if (i0) localStorage.setItem(K.img + '_0', i0); } catch (e) { }
    gravar(K.cfg, cfg);
  }
  if (prm.get('api') && prm.get('k')) {
    const faz = [{ api: prm.get('api'), k: prm.get('k'), n: prm.get('n') || '' }];
    if (prm.get('api2') && prm.get('k2')) faz.push({ api: prm.get('api2'), k: prm.get('k2'), n: prm.get('n2') || '' });
    const mudou = !cfg || JSON.stringify(cfg.faz.map(function (f) { return f.api; })) !== JSON.stringify(faz.map(function (f) { return f.api; }));
    if (mudou) [0, 1].forEach(function (i) { localStorage.removeItem(K.dados + '_' + i); localStorage.removeItem(K.img + '_' + i); });
    cfg = { u: prm.get('u') || '', faz: faz, atual: 0 }; gravar(K.cfg, cfg);
    history.replaceState(null, '', location.pathname + '#menu');
  }
  const BASE = location.href.split('#')[0].split('?')[0];
  const kd = function (i) { return K.dados + '_' + i; }, ki = function (i) { return K.img + '_' + i; };
  const lerImg = function (i) { try { return localStorage.getItem(ki(i)) || ''; } catch (e) { return ''; } };
  let dados = cfg ? ler(kd(cfg.atual), null) : null;
  let fila = ler(K.fila, []);
  let erros = ler(K.erros, []);
  let img = cfg ? lerImg(cfg.atual) : '';
  let enviando = false, ultimaFalha = '';
  function salvarDados() { if (cfg) gravar(kd(cfg.atual), dados); }
  function trocarFazenda(i) { cfg.atual = i; gravar(K.cfg, cfg); dados = ler(kd(i), null); img = lerImg(i); carregarCodigo(); location.hash = '#menu'; mostrar(); atualizar(false); }

  // fotos ficam no armazenamento grande do celular (IndexedDB), não no localStorage
  const FOTOS = (function () {
    let db = null;
    function abrir() {
      if (db) return Promise.resolve(db);
      return new Promise(function (ok, erro) {
        const r = indexedDB.open('livro_weber_fotos', 1);
        r.onupgradeneeded = function () { r.result.createObjectStore('f'); };
        r.onsuccess = function () { db = r.result; ok(db); };
        r.onerror = function () { erro(r.error); };
      });
    }
    function op(modo, fn) {
      return abrir().then(function (d) {
        return new Promise(function (ok, erro) {
          const t = d.transaction('f', modo); const st = t.objectStore('f');
          const req = fn(st); t.oncomplete = function () { ok(req && req.result); }; t.onerror = function () { erro(t.error); };
        });
      });
    }
    return {
      por: function (id, lista) { return op('readwrite', function (st) { return st.put(lista, id); }); },
      pegar: function (id) { return op('readonly', function (st) { return st.get(id); }); },
      tirar: function (id) { return op('readwrite', function (st) { return st.delete(id); }); }
    };
  })();

  function hojeLocal() {
    const d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function novoId() { return (cfg ? cfg.u : 'x').replace(/\W/g, '').slice(0, 6) + '-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 7); }

  // funções de conferência que vêm do script (as mesmas do servidor)
  let F = null;
  function carregarCodigo() {
    F = null;
    if (!dados || !dados.codigo) return;
    try { F = new Function(dados.codigo + '\nreturn { lvTxt_: lvTxt_, lvNum_: lvNum_, lvBr_: lvBr_, lvParse_: lvParse_, lvValidar_: lvValidar_, lvResumo_: lvResumo_ };')(); }
    catch (e) { F = null; }
  }
  carregarCodigo();

  // ── barra de situação ──
  function barra() {
    const b = $('bar');
    const on = navigator.onLine;
    const n = fila.length;
    b.className = '';
    let t;
    if (erros.length) { b.className = 'err'; t = '⚠️ ' + erros.length + ' lançamento(s) não aceito(s) <button id="ver">ver</button>'; }
    else if (n && enviando) { b.className = 'pend'; t = '📤 Enviando ' + n + '…'; }
    else if (n && !on) { b.className = 'off'; t = '📴 Sem sinal · ' + n + ' guardado(s) no celular'; }
    else if (n) { b.className = 'pend'; t = '📤 ' + n + ' esperando envio <button id="env">enviar</button>'; }
    else if (!on) { b.className = 'off'; t = '📴 Sem sinal · dados de ' + (dados ? dados.atualizado : '—'); }
    else { b.className = 'ok'; t = '✅ Tudo enviado · atualizado ' + (dados ? dados.atualizado : '—') + ' <button id="atu">↻</button>'; }
    b.innerHTML = t;
    if ($('ver')) $('ver').onclick = mostrarErros;
    if ($('env')) $('env').onclick = function () { enviar(); };
    if ($('atu')) $('atu').onclick = function () { atualizar(true); };
  }

  function mostrarErros() {
    const box = $('pbox');
    box.innerHTML = '<h3>⚠️ Lançamentos que o escritório não aceitou</h3>' + erros.map(function (x, i) {
      return '<div class="it"><b>' + esc(x.resumo || '') + '</b><div class="e">' + esc(x.erro) + '</div>' +
        '<button class="desc" data-i="' + i + '">🗑️ Descartar</button><small>Corrija e lance de novo, se precisar.</small></div>';
    }).join('') + '<button class="fechar" id="pf">Fechar</button>';
    $('painel').style.display = 'block';
    box.querySelectorAll('.desc').forEach(function (b) { b.onclick = function () { erros.splice(+b.dataset.i, 1); gravar(K.erros, erros); barra(); if (erros.length) mostrarErros(); else $('painel').style.display = 'none'; }; });
    $('pf').onclick = function () { $('painel').style.display = 'none'; };
  }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  // ── conversa com o script (só quando tem sinal) ──
  function url(params, fz) {
    const api = cfg.faz[fz || 0].api;
    const q = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
    return api + (api.indexOf('?') >= 0 ? '&' : '?') + q;
  }
  async function pedir(params, fz) {
    const ctl = new AbortController(); const t = setTimeout(function () { ctl.abort(); }, 45000);
    try {
      const r = await fetch(url(params, fz), { method: 'GET', redirect: 'follow', signal: ctl.signal, cache: 'no-store' });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(t); }
  }

  async function atualizar(forcar) {
    if (!cfg || !navigator.onLine) { barra(); return; }
    if (fila.length && !forcar) return;      // primeiro envia o que está guardado
    for (let i = 0; i < cfg.faz.length; i++) {
      try {
        const temImg = !!lerImg(i);
        const o = await pedir({ k: cfg.faz[i].k, u: cfg.u, app: 'dados', img: temImg ? '0' : '1' }, i);
        if (!o.ok) { if (i === cfg.atual) aviso('⚠️ ' + (o.erro || 'Erro ao buscar os dados.')); continue; }
        if (o.img) { try { localStorage.setItem(ki(i), o.img); } catch (e) { } delete o.img; }
        if (fila.length) return;             // chegou lançamento novo enquanto buscava
        const velho = ler(kd(i), null);
        if (velho && velho.cocho && o.cocho) { if (!o.cocho.ordem) o.cocho.ordem = velho.cocho.ordem; o.cocho.ultima = velho.cocho.ultima; }
        gravar(kd(i), o);
        if (!cfg.faz[i].n) { cfg.faz[i].n = o.fazenda; gravar(K.cfg, cfg); }
        if (i === cfg.atual) { dados = o; img = lerImg(i); carregarCodigo(); mostrar(); }
      } catch (e) { ultimaFalha = String(e.message || e); }
    }
    barra();
  }

  async function enviar() {
    if (enviando || !cfg || !fila.length || !navigator.onLine) { barra(); return; }
    enviando = true; barra();
    try {
      while (fila.length) {
        const item = fila[0];
        const fz = item.fz || 0, fk = cfg.faz[fz] ? cfg.faz[fz].k : cfg.faz[0].k;
        let o;
        try {
          if (item.nFotos) {
            const fotos = (await FOTOS.pegar(item.id)) || [];
            const dados2 = Object.assign({}, item.dados, { fotos: fotos });
            const ctl = new AbortController(); const t = setTimeout(function () { ctl.abort(); }, 120000);
            try {
              const r = await fetch(cfg.faz[fz].api, { method: 'POST', redirect: 'follow', signal: ctl.signal, cache: 'no-store',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify({ k: fk, id: item.id, op: item.op, dados: dados2 }) });
              if (!r.ok) throw new Error('HTTP ' + r.status);
              o = await r.json();
            } finally { clearTimeout(t); }
          } else {
            o = await pedir({ k: fk, app: 'enviar', d: JSON.stringify({ id: item.id, op: item.op, dados: item.dados }) }, fz);
          }
        }
        catch (e) { ultimaFalha = String(e.message || e); break; }       // sem sinal de verdade: tenta depois
        if ((o.ok || o.definitivo) && item.nFotos) { try { await FOTOS.tirar(item.id); } catch (e) { } }
        if (o.ok && item.op === 'C') {                  // leitura de cocho: guarda a ordem de trato que voltou
          const dz = fz === cfg.atual ? dados : ler(kd(fz), null);
          if (dz && dz.cocho) { if (o.ordem) dz.cocho.ordem = o.ordem; dz.cocho.quando = new Date().toLocaleString('pt-BR').slice(0, 17); dz.cocho.ultima = item.dados.data; gravar(kd(fz), dz); }
          if (location.hash === '#cocho' && fz === cfg.atual) telaCocho();
        }
        if (o.ok) { fila.shift(); gravar(K.fila, fila); }
        else if (o.definitivo) { erros.push({ resumo: item.resumo, erro: o.erro, dados: item.dados }); gravar(K.erros, erros); fila.shift(); gravar(K.fila, fila); }
        else { ultimaFalha = o.erro; break; }
        barra();
      }
    } finally { enviando = false; }
    barra();
    if (!fila.length) atualizar(true);
  }

  // ── o que as telas chamam no lugar do google.script.run ──
  function acharClasse(L, palavras) {
    return L.classes.map(function (c) { return c.toUpperCase(); }).filter(function (c) { return palavras.every(function (w) { return c.indexOf(w) >= 0; }); })[0];
  }
  function pastoMapa(nome) {
    if (!dados.mapa) return null;
    return dados.mapa.pastos.concat(dados.mapa.fora || []).filter(function (p) { return p.nome === nome; })[0] || null;
  }
  function somarCat(p, c, q, desde, de) {
    if (!p) return;
    let x = p.cats.filter(function (k) { return k.c === c; })[0];
    if (!x) { x = { c: c, q: 0, p: null, desde: '', de: '' }; p.cats.push(x); }
    x.q += q; if (desde) { x.desde = desde; x.de = de || ''; }
    p.cats = p.cats.filter(function (k) { return k.q !== 0; });
  }
  function histMapa(p, d, i, t) { if (p) p.hist.unshift({ d: d, i: i, t: t }); }

  const API = {
    gravar: async function (d) {
      if (!dados || !F) throw new Error('O app ainda não baixou os dados. Abra uma vez com sinal.');
      const L = dados.listas;
      const p = F.lvParse_(d);
      const hoje = hojeLocal();
      const e = F.lvValidar_(p, L, hoje);
      if (e.length) throw new Error(e.join('\n'));
      p.outra = L.outra;
      // efeitos na tela, até o escritório confirmar
      if (p.tipo === 'SUPL' && dados.estoque) { dados.estoque[p.produto] = Math.round(((dados.estoque[p.produto] || 0) - p.qtd) * 100) / 100; p.saldo = dados.estoque[p.produto]; }
      if (p.tipo === 'ATIV' && dados.semana) {
        const dias = Math.round((Date.parse(hoje) - Date.parse(p.data)) / 86400000);
        if (dias >= 0 && dias <= 6) dados.semana[6 - dias].ok = true;
      }
      const pm = pastoMapa(p.pasto);
      if (pm && p.tipo === 'NASC') {
        const cru = p.raca === 'CRUZADO';
        somarCat(pm, acharClasse(L, ['BEZERRO', cru ? 'CRUZ' : 'NELORE']), p.machos, p.data, 'nascimento');
        somarCat(pm, acharClasse(L, ['BEZERRA', cru ? 'CRUZ' : 'NELORE']), p.femeas, p.data, 'nascimento');
        histMapa(pm, p.data, '🐮', 'Nasceram ' + (p.machos + p.femeas) + ' bezerro(s) (guardado no celular)');
      }
      if (pm && p.tipo === 'MORTE') {
        const w = p.categoria.toUpperCase().split(' ')[0];
        const c = pm.cats.filter(function (k) { return k.c.indexOf(w) === 0 && k.q > 0; }).sort(function (a, b) { return b.q - a.q; })[0];
        if (c) somarCat(pm, c.c, -p.qtd);
        histMapa(pm, p.data, '☠️', 'Morreu ' + p.qtd + ' ' + p.categoria + ' (guardado no celular)');
      }
      if (pm && p.tipo === 'TRANSF') { somarCat(pm, p.classe.toUpperCase(), -p.qtd); histMapa(pm, p.data, '🚛', 'Saíram ' + p.qtd + ' ' + p.classe + ' para ' + p.destino + ' (' + L.outra + ')'); }
      if (pm && (p.tipo === 'SUPL' || p.tipo === 'ATIV' || p.tipo === 'PESO')) histMapa(pm, p.data, p.tipo === 'SUPL' ? '🧂' : p.tipo === 'PESO' ? '⚖️' : '📝', F.lvResumo_(p));
      if (pm && p.tipo === 'PROB') {
        pm.probs = pm.probs || [];
        pm.probs.unshift({ id: 'novo', d: p.data, tipo: p.probTipo, desc: p.desc, quem: p.quem, fotos: [], local: true });
        histMapa(pm, p.data, '⚠️', p.probTipo + ' — ' + p.desc + ' (guardado no celular)');
      }
      const resumo = F.lvResumo_(p);
      const id = novoId();
      const nFotos = (d.fotos || []).length;
      const dSem = Object.assign({}, d, { fotos: [] });
      if (nFotos) {
        try { await FOTOS.por(id, d.fotos); }
        catch (e) { throw new Error('Não consegui guardar as fotos no celular (sem espaço?). Tente com menos fotos.'); }
      }
      fila.push({ id: id, op: 'L', fz: cfg.atual, dados: dSem, nFotos: nFotos, resumo: resumo, quando: Date.now() });
      gravar(K.fila, fila); salvarDados();
      barra(); setTimeout(enviar, 400);
      return { ok: true, msg: (navigator.onLine ? '📤 Enviando para o livro…' : '📥 Guardado no celular. Vai sozinho para o livro quando tiver sinal.') + '\n' + resumo,
        semana: dados.semana, estoque: dados.estoque };
    },
    mover: async function (d) {
      if (!dados || !dados.mapa) throw new Error('Mapa ainda não baixado. Abra uma vez com sinal.');
      const M = dados.mapa;
      const o = pastoMapa(d.de);
      const q = Number(d.q);
      if (!d.quem) throw new Error('Falta o nome de quem está lançando.');
      if (!d.para) throw new Error('Escolha o destino.');
      if (!(q >= 1) || Math.floor(q) !== q) throw new Error('Informe a quantidade.');
      if (d.data > hojeLocal()) throw new Error('A data não pode ser depois de hoje.');
      const tem = o ? (o.cats.filter(function (k) { return k.c === d.c; })[0] || { q: 0 }) : { q: 0 };
      if (q > tem.q && !d.forcar) throw new Error('PASSOU|' + tem.q);
      const entre = d.fazDest && d.fazDest !== dados.fazenda;
      somarCat(o, d.c, -q);
      histMapa(o, d.data, entre ? '🚛' : '🚚', 'Saíram ' + q + ' ' + d.c + ' para ' + d.para + (entre ? ' (fazenda ' + d.fazDest + ')' : '') + ' — guardado no celular');
      if (!entre) {
        const p = pastoMapa(d.para);
        somarCat(p, d.c, q, d.data, d.de);
        histMapa(p, d.data, '🚚', 'Entraram ' + q + ' ' + d.c + ' vindos de ' + d.de + ' — guardado no celular');
      }
      const dd = Object.assign({}, d); delete dd.forcar;
      const resumo = (entre ? '🚛 ' : '🚚 ') + q + ' ' + d.c + ': ' + d.de + ' → ' + d.para + (entre ? ' (' + d.fazDest + ')' : '');
      fila.push({ id: novoId(), op: 'M', fz: cfg.atual, dados: dd, resumo: resumo, quando: Date.now() });
      gravar(K.fila, fila); salvarDados();
      barra(); setTimeout(enviar, 400);
      return Object.assign({}, M, { msg: resumo + (navigator.onLine ? ' · enviando…' : ' · guardado no celular') });
    }
  };
  window.LIVRO_OFF = API;

  // ── telas (as mesmas do app online, recebidas do script) ──
  const SHIM = '<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"><script>(function(){var P=window.parent.LIVRO_OFF;' +
    'function R(){var s=function(){},f=function(){};var r={withSuccessHandler:function(x){s=x;return r},withFailureHandler:function(x){f=x;return r},' +
    'livroGravar:function(k,d){P.gravar(d).then(s,f)},livroMover:function(k,d){P.mover(d).then(s,f)}};return r}' +
    'window.google={script:{get run(){return R()}}};})();<\/script>';

  function esconder() { ['aviso', 'tela', 'home', 'cocho'].forEach(function (i) { $(i).style.display = 'none'; }); }
  function aviso(html) { esconder(); $('aviso').innerHTML = html; $('aviso').style.display = 'block'; }

  // ── tela inicial: tudo da fazenda num lugar só ──
  function telaInicio() {
    esconder();
    const h = $('home');
    const outra = cfg.faz.length > 1 ? cfg.faz[cfg.atual === 0 ? 1 : 0] : null;
    h.innerHTML = '<div class="hd"><h1>🌾 Fazenda ' + esc(dados.fazenda.charAt(0) + dados.fazenda.slice(1).toLowerCase()) + '</h1><p>' + (cfg.u ? '👤 ' + esc(cfg.u) : '') + '</p></div>' +
      '<div class="mn">' +
      (dados.cocho ? '<a href="#cocho">🐄 Leitura de cocho<small>Confinamento — 0, 1 ou 2 por baia' + (dados.cocho.ultima === hojeLocal() ? ' · ✅ hoje já enviada' : pendenteCocho() ? ' · 📥 guardada, esperando sinal' : '') + '</small></a>' : '') +
      '<a class="c2" href="#livro">📒 Lançamentos<small>Diário · Suplementação · Problema · Nascimento · Morte · Pesagem…</small></a>' +
      (dados.mapa ? '<a class="c3" href="#mapa">🗺️ Mapa da fazenda<small>Gado em cada pasto · trocar de pasto · histórico</small></a>' : '') +
      (outra ? '<button class="bb c4" id="trocar">🔄 Ir para a fazenda ' + esc(outra.n || 'outra') + '<small>Você trabalha nas duas</small></button>' : '') +
      '</div>';
    h.style.display = 'block';
    if ($('trocar')) $('trocar').onclick = function () { trocarFazenda(cfg.atual === 0 ? 1 : 0); };
    barra();
  }

  // ── leitura de cocho (funciona sem sinal) ──
  function pendenteCocho() { return fila.some(function (x) { return x.op === 'C' && (x.fz || 0) === cfg.atual && x.dados.data === hojeLocal(); }); }
  function telaCocho(msg) {
    esconder();
    const c = $('cocho'); const B = dados.cocho.baias; const L = {};
    const hoje = hojeLocal();
    c.innerHTML = '<div class="hd"><a href="#menu">◀ Menu</a><h1>🐄 Leitura de cocho</h1><p>' + hoje.split('-').reverse().join('/') + (cfg.u ? ' · 👤 ' + esc(cfg.u) : '') + '</p></div><div class="cx">' +
      (msg ? '<div class="ok2">' + esc(msg) + '</div>' : '') +
      (pendenteCocho() ? '<div class="ok2">📥 A leitura de hoje está guardada no celular e vai sozinha quando tiver sinal.</div>' :
        dados.cocho.ultima === hoje ? '<div class="ok2">✅ A leitura de hoje já foi para a planilha. Se mandar de novo, ela substitui.</div>' : '') +
      '<div class="card"><div class="leg">0 = vazio (faltou) · 1 = zerou certinho · 2 = sobrou</div>' +
      B.map(function (b) { return '<div class="bl"><b>' + esc(b) + '</b>' + [0, 1, 2].map(function (v) { return '<button data-b="' + esc(b) + '" data-v="' + v + '">' + v + '</button>'; }).join('') + '</div>'; }).join('') +
      '<input class="inp" id="cobs" placeholder="Observação (chuva, animal doente...)"><button class="env" id="cenv">ENVIAR LEITURA</button></div>' +
      (dados.cocho.ordem ? '<div class="card"><b>🧾 Ordem de trato</b> <small>(' + esc(dados.cocho.quando || dados.atualizado || '') + ')</small><textarea class="ord" readonly>' + esc(dados.cocho.ordem) + '</textarea></div>'
        : '<div class="card"><small>A ordem de trato aparece aqui depois que a leitura chegar na planilha.</small></div>') +
      '</div>';
    c.style.display = 'block';
    c.querySelectorAll('.bl button').forEach(function (bt) {
      bt.onclick = function () {
        const b = bt.dataset.b, v = +bt.dataset.v; L[b] = v;
        c.querySelectorAll('.bl button[data-b="' + b + '"]').forEach(function (x) { x.className = +x.dataset.v === v ? 'on' + v : ''; });
      };
    });
    $('cenv').onclick = function () {
      const falta = B.filter(function (b) { return !(b in L); });
      if (falta.length) { alert('Falta marcar: ' + falta.join(', ')); return; }
      if (!cfg.u) { alert('Este link não tem o seu nome. Peça o link certo ao escritório.'); return; }
      fila = fila.filter(function (x) { return !(x.op === 'C' && (x.fz || 0) === cfg.atual && x.dados.data === hoje); });   // nova leitura do dia substitui a guardada
      fila.push({ id: novoId(), op: 'C', fz: cfg.atual, dados: { quem: cfg.u, data: hoje, leituras: L, obs: $('cobs').value },
        resumo: '🐄 Leitura de cocho ' + hoje.split('-').reverse().join('/') + ': ' + B.map(function (b) { return b + '=' + L[b]; }).join(' '), quando: Date.now() });
      gravar(K.fila, fila); barra(); setTimeout(enviar, 300);
      telaCocho(navigator.onLine ? '📤 Enviando a leitura… a ordem de trato aparece logo abaixo.' : '📥 Leitura guardada no celular. Vai sozinha quando tiver sinal, e a ordem de trato aparece aqui.');
      window.scrollTo(0, 0);
    };
    barra();
  }

  function mostrar() {
    if (!cfg) { aviso('<h2>📒 Livro Pecuário</h2><p>Abra o <b>link que o escritório mandou</b> para configurar este celular.</p>'); barra(); return; }
    if (!dados) { aviso('<h2>📒 Livro Pecuário</h2><p>Primeira vez: o app precisa de <b>sinal uma vez</b> para baixar os pastos e as listas.</p><p>' + (navigator.onLine ? 'Baixando…' : '📴 Sem sinal agora. Abra de novo na sede.') + '</p>'); barra(); return; }
    const hs = location.hash;
    if (!hs || hs === '#menu' || (hs === '#mapa' && !dados.mapa) || (hs === '#cocho' && !dados.cocho)) { telaInicio(); return; }
    if (hs === '#cocho') { telaCocho(); return; }
    esconder(); $('tela').style.display = 'block';
    const L = dados.listas;
    let html;
    if (location.hash === '#mapa' && dados.mapa && dados.telaMapa) {
      const D = Object.assign({}, dados.mapa, { k: cfg.faz[cfg.atual].k, u: cfg.u, fazenda: dados.fazenda, hoje: hojeLocal(), voltar: BASE + '#menu', classes: L.classes, funcionarios: L.funcionarios,
        linkProb: BASE + '#prob=' });
      html = dados.telaMapa.replace('__IMG__', function () { return img || ''; })
        .replace('__DADOS__', function () { return JSON.stringify(D).replace(/</g, '\\u003c'); });
    } else {
      const D = { k: cfg.faz[cfg.atual].k, u: cfg.u, fazenda: dados.fazenda, hoje: hojeLocal(), listas: L, semana: cfg.u ? dados.semana : null, estoque: dados.estoque,
        menu: BASE + '#menu', mapa: dados.mapa ? BASE + '#mapa' : '',
        pre: location.hash.indexOf('#prob=') === 0 ? { pasto: decodeURIComponent(location.hash.slice(6)).toUpperCase(), tipo: 'PROB' } : null };
      html = dados.telaLivro.replace('__DADOS__', function () { return JSON.stringify(D).replace(/</g, '\\u003c'); });
    }
    $('tela').srcdoc = html.replace('<head>', function () { return '<head>' + SHIM; });
    barra();
  }
  window.addEventListener('hashchange', mostrar);
  window.addEventListener('online', function () { barra(); enviar(); atualizar(false); });
  window.addEventListener('offline', barra);
  setInterval(function () { if (fila.length) enviar(); }, 60000);

  mostrar();
  if (fila.length) enviar(); else atualizar(false);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { });
})();
</script>
</body>
</html>
